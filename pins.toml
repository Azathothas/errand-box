# Versions and sha256 digests of everything errand-box downloads.
#
# `latest` names the newest pinned version, and `latest` in errand-box.toml
# means that one: errand-box never runs bytes whose digest it has not
# recorded here. The freshness workflow (.github/workflows/freshness.yml)
# checks upstream releases every week and opens a pull request that adds a
# new version and moves `latest`.
#
# Digests: each value matches the digest GitHub records for the release
# asset (checked 2026-10-23), and the .sha256 file an upstream publishes next
# to an asset where it has one. scripts/pins.sh checks both when it adds a
# version. errand is not here: it is built into errand-box (T-028).

[kage]
latest = "v0.5.0"

[kage.versions."v0.5.0".x86_64]
url = "https://github.com/QaidVoid/kage/releases/download/v0.5.0/kage-x86_64-linux.tar.xz"
sha256 = "bc10c6c217d6580e2cb2670fd5c65af3f3bbe443e9e5c6df594db3747decfce0"

[kage.versions."v0.5.0".aarch64]
url = "https://github.com/QaidVoid/kage/releases/download/v0.5.0/kage-aarch64-linux.tar.xz"
sha256 = "6a93d2bf0a8036bc7c3d0c99c337d34ac0570d39529f008f995bf560aeb9a78b"
