# A release of the version in Cargo.toml. It builds the static binary on each
# architecture through scripts/ci-local.sh (the same step a session runs),
# writes SHA256SUMS, and publishes the GitHub release that bootstrap.sh reads:
#   errand-box-x86_64-linux-musl, errand-box-aarch64-linux-musl, SHA256SUMS
#
# Two ways to start it, and both check that the version is Cargo.toml's:
#   - push a tag vX.Y.Z; the release goes on that tag.
#   - dispatch it on main with the input version vX.Y.Z; the release goes on
#     the dispatched commit and creates the tag. It refuses a tag that exists.
# The second needs no tag push, for a client that can push a branch and not a
# tag. A tag the workflow token creates starts no other workflow, so this
# workflow does not run twice.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'vX.Y.Z, the version in Cargo.toml; the tag must not exist yet'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the version is Cargo.toml's, and a dispatch is on main with a new tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "v$v" = "$TAG" ] || { echo "version $TAG, Cargo.toml $v"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$REF" = refs/heads/main ] || { echo "dispatch a release on main, not $REF"; exit 1; }
            # --exit-code: 2 when no ref matches, which is the one answer that lets
            # this pass. The step runs under bash -e, so the code is caught with ||.
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || rc=$?
            [ "$rc" = 2 ] || { echo "the tag $TAG exists, or the remote did not answer (git ls-remote exit $rc)"; exit 1; }
          fi
      - name: build and run the static binary
        run: sh scripts/ci-local.sh --step musl
      - name: name the asset
        run: |
          mkdir -p dist
          cp "target/${{ matrix.arch }}-unknown-linux-musl/release/errand-box" "dist/errand-box-${{ matrix.arch }}-linux-musl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: errand-box-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum errand-box-*-linux-musl > SHA256SUMS
          cat SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          # A pushed tag must exist; a dispatch creates the tag on the commit it built.
          if [ "$EVENT" = workflow_dispatch ]; then set -- --target "$SHA"; else set -- --verify-tag; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" "$@" \
            --notes "Static binaries for x86_64 and aarch64 Linux, and their SHA-256 digests. Install with bootstrap.sh; see docs/operations.md." \
            dist/errand-box-x86_64-linux-musl dist/errand-box-aarch64-linux-musl dist/SHA256SUMS
