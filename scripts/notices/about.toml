# cargo-about configuration for THIRD-PARTY-NOTICES, read by
# scripts/notices.sh. Every licence a crate of the release binary carries
# must be listed; a crate under any other licence stops the generation.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
