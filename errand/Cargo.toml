[package]
name = "errand"
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
description = "Run a coding agent from a chat channel, in a sandbox it cannot escape."
authors = ["Rabindra Dhakal"]
repository = "https://github.com/Azathothas/errand-box"
publish = false
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "errand"
path = "src/lib.rs"
# The doc comments show configuration and shell, not Rust to compile.
doctest = false

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", features = ["io"] }
getrandom = "0.4.3"
http = "1.5.0"
jiff = "0.2.37"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
# serenity's own reqwest, so `src/chat/endpoint.rs` can hand serenity a REST
# client built with `.no_proxy()` for the local stand-in. serenity already
# locks this version with this feature, so it adds no crate.
reqwest012 = { package = "reqwest", version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "model", "http", "rustls_backend", "cache"] }
# The userspace TCP/IP stack for the virtual network layer (T-090). Only the
# IP medium (a TUN or an interposed AF_UNIX link carries raw IP, no ethernet)
# and TCP are needed; the phy backends are this crate's own.
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
url = "2.5.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net", "fs", "signal"] }

[dev-dependencies]
# The local Discord stand-in the chat path is tested against (T-035).
discord-mock = { path = "../discord-mock" }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Pedantic since Rust 1.99. The tests assert emptiness with `is_empty()`, and
# the suggested `assert_eq!(x, [] as [T; 0])` names the type at every site.
assert_is_empty = "allow"

